
name: Build Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev cmake build-essential \
            libltdl-dev

      - name: Install Buildozer and Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer

      - name: Locate Buildozer Configuration
        id: locate
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          echo "Repository files:"
          ls -la

          SPEC="$(find . -type f -name 'buildozer.spec' \
            -not -path './.git/*' \
            -not -path './.buildozer/*' \
            -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "::error::buildozer.spec not found. Add it to your GitHub repository."
            exit 1
          fi

          SPEC_DIR="$(dirname "$SPEC")"
          echo "spec_dir=$SPEC_DIR" >> "$GITHUB_OUTPUT"

          echo "Found configuration: $SPEC"
          echo "Project directory: $SPEC_DIR"
          ls -la "$SPEC_DIR"

      - name: Build with Buildozer
        working-directory: .
        env:
          SPEC_DIR: ${{ steps.locate.outputs.spec_dir }}
        run: |
          cd "$SPEC_DIR"
          buildozer -v android debug

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "**/bin/*.apk"
          if-no-files-found: error
          retention-days: 7
